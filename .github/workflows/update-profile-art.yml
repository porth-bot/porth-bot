name: update profile art

on:
  schedule:
    # daily, a little after midnight US/Central
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install -r scripts/requirements.txt

      - name: refresh contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_contributions.py --login porth-bot
          python scripts/render_heatmap.py

      - name: commit if changed
        run: |
          # commit as the Actions bot, not as porth-bot: a refresh is not a
          # contribution, and committing as the account would put a square on
          # the graph every day whether or not any real work happened
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg scripts/contrib.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh contribution heatmap"
            git push
          fi
